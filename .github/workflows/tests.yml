name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install the chat client
      run: |
        pip install -e packages/ephemeris-cli
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        pytest tests/test_unit.py -v
    
    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v
      continue-on-error: true

    # Latency thresholds are not enforced here -- see `enforce_on_ci` in
    # TESTING.md. This step records the measurements so the report is
    # readable from the PR without a local run.
    - name: Run scenario benchmarks
      run: |
        pytest tests/test_latency.py -v --report-md=reports/test_report.md
      continue-on-error: true

    - name: Upload the scenario report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scenario-report-py${{ matrix.python-version }}
        path: reports/test_report.md
        if-no-files-found: ignore
