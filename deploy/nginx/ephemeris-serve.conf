# nginx reverse proxy for Ephemeris Serve.
#
# Install as a site config (adjust paths for your distro):
#   Debian/Ubuntu: /etc/nginx/sites-available/ephemeris-serve.conf
#                  + symlink into /etc/nginx/sites-enabled/
#   RHEL/Alpine:   /etc/nginx/conf.d/ephemeris-serve.conf
#   macOS/Homebrew: /opt/homebrew/etc/nginx/servers/ephemeris-serve.conf
#
# Then: nginx -t && nginx -s reload
#
# The /api/generate location disables response buffering. Measured on nginx
# 1.31.3, SSE frames pass through with the same timing as a direct connection
# even with buffering left on -- nginx forwards each chunked read rather than
# waiting to fill a buffer -- so treat these directives as insurance, not as a
# fix for a reproduced failure. They matter when something downstream of the
# defaults changes: gzip widened to cover text/event-stream, a proxy_cache
# added, or an nginx build/version that coalesces small chunks.
#
# Run uvicorn with --proxy-headers so the app sees the client's real scheme and
# address rather than nginx's (`ephemeris-serve serve` does this by default).

upstream ephemeris_serve {
    # uvicorn's own listener. Keep this bound to loopback in production so the
    # API is only reachable through this proxy.
    server 127.0.0.1:8000;

    # Reuse upstream connections instead of reconnecting per request. Long-held
    # SSE connections each occupy one slot, so size this against the number of
    # concurrent streams you expect, not the request rate.
    keepalive 32;
}

# Rate limit by client address. Generation is expensive and single-process, so
# this is a blunt guard against one client saturating the scheduler queue.
limit_req_zone $binary_remote_addr zone=ephemeris_api:10m rate=10r/s;

server {
    listen 8080;
    listen [::]:8080;

    # Replace with your own hostname for a real deployment. `_` matches any
    # Host header, which is fine for local use and behind another load balancer.
    server_name _;

    # The CLI/clients send prompts as JSON; keep this modest so a runaway body
    # is rejected at the proxy rather than in Python.
    client_max_body_size 1m;

    # A slow client should not hold a worker forever while it dribbles a body.
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    access_log /var/log/nginx/ephemeris-serve.access.log;
    error_log  /var/log/nginx/ephemeris-serve.error.log;

    # ---- Shared proxy behavior -------------------------------------------
    # Repeated per location rather than set once at server level, because
    # `proxy_*` directives set here would still need overriding in the SSE
    # location and split settings are easy to misread.

    location = /health {
        proxy_pass http://ephemeris_serve;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health checks should fail fast rather than hang.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;

        access_log off;
    }

    # ---- SSE streaming ---------------------------------------------------
    # POST /api/generate returns text/event-stream and can stay open for the
    # whole generation. Buffering and short read timeouts both break it.
    location = /api/generate {
        proxy_pass http://ephemeris_serve;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hold nothing back: each SSE frame must reach the client as the
        # scheduler emits it. sse_starlette also sets `X-Accel-Buffering: no`
        # on the response, which nginx honors on its own -- these directives
        # keep the behavior if that header ever goes away.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # `proxy_buffering off` above is what stops *this* nginx buffering.
        # This header is for whatever sits in front of nginx (a CDN, another
        # proxy) and honors it -- it has no effect on nginx's own buffering of
        # this response.
        add_header X-Accel-Buffering no;

        # The stream is idle between tokens and while the model warms up or a
        # /model swap drains; must comfortably exceed the server's
        # streaming_request_timeout_seconds (settings/config.yaml).
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # A disconnecting client must propagate to the app: the scheduler
        # cancels the request's future on client close, so leaving the upstream
        # request running would keep generating tokens nobody is reading.
        proxy_ignore_client_abort off;

        limit_req zone=ephemeris_api burst=20 nodelay;
    }

    # ---- Everything else on the API --------------------------------------
    # /api/generate_batch, /api/model, /api/metrics: ordinary buffered JSON.
    location /api/ {
        proxy_pass http://ephemeris_serve;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /api/model drains in-flight work and then loads (often
        # downloads) a whole model, so it can legitimately take minutes --
        # longer than model_swap_drain_timeout_seconds plus the load itself.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        limit_req zone=ephemeris_api burst=20 nodelay;
    }

    location / {
        proxy_pass http://ephemeris_serve;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

# ---- TLS ------------------------------------------------------------------
# For a public deployment, terminate TLS at nginx and keep uvicorn on plain
# loopback HTTP. Obtain a certificate (e.g. certbot), then replace the server
# block above with the pair below, keeping every location block unchanged.
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name ephemeris.example.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name ephemeris.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/ephemeris.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/ephemeris.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # ... the location blocks from above, verbatim ...
# }
