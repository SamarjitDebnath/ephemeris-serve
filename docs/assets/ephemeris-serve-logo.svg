<svg id="ephemeris-logo-mark" width="100%" viewBox="0 0 680 350" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<style>
  :root { color-scheme: light dark; }
  /* Every shape below also carries an inline style with a hardcoded near-black
     stroke/fill (rgb(11,11,11)) from the original export -- these rules use
     !important specifically to override that per-element color, without
     touching stroke-width/dasharray/etc. Loaded standalone via &lt;img src&gt;
     (e.g. from README.md), this SVG has no access to a host page's CSS
     variables, so a fixed near-black mark would be invisible against a dark
     background (GitHub dark theme, dark terminals, ...) without this. */
  #ephemeris-logo-mark line,
  #ephemeris-logo-mark circle[fill="none"],
  #ephemeris-logo-mark ellipse {
    stroke: #161616 !important;
  }
  #ephemeris-logo-mark circle:not([fill="none"]) {
    fill: #161616 !important;
  }
  @media (prefers-color-scheme: dark) {
    #ephemeris-logo-mark line,
    #ephemeris-logo-mark circle[fill="none"],
    #ephemeris-logo-mark ellipse {
      stroke: #f0f0f0 !important;
    }
    #ephemeris-logo-mark circle:not([fill="none"]) {
      fill: #f0f0f0 !important;
    }
  }
</style>
