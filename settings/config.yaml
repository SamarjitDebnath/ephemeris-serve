model_config:
   defaults:
      model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0 # alternatives: "openai-community/gpt2-medium", "distilgpt2", "gpt2-large", "TinyLlama/TinyLlama-1.1B-Chat-v1.0", "Qwen/Qwen2.5-0.5B"
      device: "auto" # "auto" detects CUDA (NVIDIA GPU), then MPS (Apple Silicon), then CPU. Override with "cpu", "cuda", or "mps" to pin a device.
      max_length: 1024
      temperature: 0.7
      top_k: 8
      top_p: 0.9
      repetition_penalty: 1.2
      num_return_sequences: 1

logging_config:
   defaults:
      log_level: "DEBUG"
      log_file: "logs/app.log"

scheduler_config:
   defaults:
      streaming_request_timeout_seconds: 60.0
      batch_request_timeout_seconds: 20.0
      batch_generation_timeout_seconds: 25.0
      idempotency_key_ttl_seconds: 300.0
      model_swap_drain_timeout_seconds: 30.0 # max time POST /api/model waits for in-flight requests to finish before giving up

cache_config:
   defaults:
      kv_block_size: 16