# Ephemeris CLI client configuration.
#
# This is the packaged default, shipped inside the `cli` package. It is read by
# `ephemeris start` to decide which server to talk to, so the address is
# never hardcoded in Python.
#
# Do not edit this file for a real deployment -- it is overwritten whenever the
# package is reinstalled or upgraded. Put your own value in a user-level file
# instead, which takes precedence over everything here:
#
#   ~/.config/ephemeris/client.yaml
#
# ...or point EPHEMERIS_CLIENT_CONFIG at a config file anywhere on disk. A
# single address can also be set without any file at all, via the
# EPHEMERIS_CLIENT_URL environment variable, or per-invocation with
# `ephemeris start --url https://...`.
#
# Resolution order, highest priority first:
#   1. --url (or --host/--port) command-line options
#   2. EPHEMERIS_CLIENT_URL environment variable
#   3. EPHEMERIS_CLIENT_CONFIG file, if set
#   4. ~/.config/ephemeris/client.yaml  (XDG_CONFIG_HOME is honored)
#   5. this file

client_config:
   defaults:
      # Address of the Ephemeris Serve HTTP API, including scheme and port.
      #
      # Port 8080 is the nginx reverse proxy from deploy/nginx (see the
      # deployment docs), not uvicorn's own port -- run the CLI against the
      # proxy so it exercises the same path real clients take. To bypass nginx
      # and hit uvicorn directly, use http://127.0.0.1:8000.
      #
      # For a remote deployment this becomes the public address, e.g.
      #   base_url: "https://ephemeris.example.com"
      base_url: "http://127.0.0.1:8080"

      # Per-request HTTP timeout in seconds. A cold model load or a long
      # generation can take a while; --timeout overrides this per invocation.
      timeout_seconds: 120.0

      # API key, sent as "Authorization: Bearer <key>". Leave empty for a
      # server with no keys configured (the local-development default).
      #
      # Prefer the EPHEMERIS_CLIENT_API_KEY environment variable over writing the key
      # here -- unlike base_url, this is a credential, and the env var takes
      # precedence over any file. If you do put it in a file, use the
      # user-level one and `chmod 600` it, never this packaged file.
      api_key: ""
